<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operation Live View</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <div>
          <p class="eyebrow">Live Operation</p>
          <h1>操作過程展示</h1>
          <p class="summary">
            把系統正在做的每個步驟，用時間軸即時顯示在網頁上。
          </p>
        </div>
        <button id="runButton" class="primary-button">開始示範</button>
      </section>

      <section class="dashboard">
        <div class="panel status-panel">
          <p class="panel-label">目前狀態</p>
          <div id="status" class="status">等待開始</div>
          <div class="progress-track">
            <div id="progress" class="progress-bar"></div>
          </div>
        </div>

        <div class="panel log-panel">
          <div class="panel-heading">
            <p class="panel-label">操作紀錄</p>
            <button id="clearButton" class="ghost-button">清除</button>
          </div>
          <ol id="logList" class="log-list"></ol>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
