<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operation Live View</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <div>
          <p class="eyebrow">Trading Monitor</p>
          <h1>自動交易監控</h1>
          <p class="summary">
            顯示 OKX paper 自動交易 runner 的最新決策、訊號與執行紀錄。
          </p>
        </div>
        <button id="refreshButton" class="primary-button">刷新</button>
      </section>

      <section class="dashboard">
        <div class="panel status-panel">
          <p class="panel-label">目前狀態</p>
          <div id="status" class="status">HOLD / HOLD</div>
          <dl class="metric-list">
            <div>
              <dt>標的</dt>
              <dd id="instrument">BTC-USDT</dd>
            </div>
            <div>
              <dt>策略</dt>
              <dd id="strategy">trend-long-short</dd>
            </div>
            <div>
              <dt>最新價格</dt>
              <dd id="lastClose">63,463.3</dd>
            </div>
            <div>
              <dt>模式</dt>
              <dd id="mode">paper / execute=false</dd>
            </div>
          </dl>
        </div>

        <div class="panel log-panel">
          <div class="panel-heading">
            <p class="panel-label">最新決策</p>
            <span id="updatedAt" class="updated-at">更新 06/12 05:56:25</span>
          </div>
          <ol id="logList" class="log-list">
            <li class="log-item">
              <span class="log-time">06/12 05:56:25</span>
              <span class="log-message">決策：hold</span>
            </li>
            <li class="log-item">
              <span class="log-time">signal</span>
              <span class="log-message">訊號：hold</span>
            </li>
            <li class="log-item">
              <span class="log-time">reason</span>
              <span class="log-message">原因：no trend cross</span>
            </li>
          </ol>
        </div>
      </section>
    </main>

    <script src="./script.js?v=20260612-0601"></script>
  </body>
</html>
