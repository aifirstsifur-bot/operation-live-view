<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operation Live View</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <div>
          <p class="eyebrow">Trading Monitor</p>
          <h1>自動交易監控</h1>
          <p class="summary">
            顯示 OKX paper 自動交易 runner 的最新決策、訊號與執行紀錄。
          </p>
        </div>
        <button id="refreshButton" class="primary-button">刷新</button>
      </section>

      <section class="dashboard">
        <div class="panel status-panel">
          <p class="panel-label">目前狀態</p>
          <div id="status" class="status">等待開始</div>
          <dl class="metric-list">
            <div>
              <dt>標的</dt>
              <dd id="instrument">--</dd>
            </div>
            <div>
              <dt>策略</dt>
              <dd id="strategy">--</dd>
            </div>
            <div>
              <dt>最新價格</dt>
              <dd id="lastClose">--</dd>
            </div>
            <div>
              <dt>模式</dt>
              <dd id="mode">--</dd>
            </div>
          </dl>
        </div>

        <div class="panel log-panel">
          <div class="panel-heading">
            <p class="panel-label">最新決策</p>
            <span id="updatedAt" class="updated-at">--</span>
          </div>
          <ol id="logList" class="log-list">
            <li class="log-item">
              <span class="log-time">--</span>
              <span class="log-message">等待資料發布</span>
            </li>
          </ol>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
